services:
  - type: web
    name: workwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workwise-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CV_MODEL
        value: gpt-4o-mini
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: workwise-db
    databaseName: workwise
    user: workwise
